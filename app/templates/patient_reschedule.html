<!DOCTYPE html>
<html>
<head>
    <title>Reschedule Appointment</title>
</head>
<body>

<h2>Reschedule Appointment</h2>

<p><b>Doctor:</b> {{ appt.doctor.name }}</p>
<p><b>Current Date:</b> {{ appt.date }}</p>
<p><b>Current Time:</b> {{ appt.time }}</p>

<form method="POST">

    <label>Select New Date:</label><br>
    <select name="date" required>
        {% for a in avail_data %}
            {% if a.available %}
                <option value="{{ a.date }}">{{ a.date }}</option>
            {% endif %}
        {% endfor %}
    </select>
    <br><br>

    <label>Select New Time:</label><br>
    <select name="time" required>
        <option value="09:00:00">09:00 AM</option>
        <option value="10:00:00">10:00 AM</option>
        <option value="11:00:00">11:00 AM</option>
        <option value="15:00:00">03:00 PM</option>
        <option value="16:00:00">04:00 PM</option>
    </select>

    <br><br>
    <button type="submit">Save Changes</button>

</form>

<br>
<a href="/patient/dashboard">Cancel</a>

</body>
</html>
