{% extends "base.html" %}

{% block title %}Add Doctor - PulseCare HMS{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5 glass-card-hover">
            <div class="mb-4">
                <a href="{{ url_for('routes.admin_dashboard') }}" class="text-muted text-decoration-none small">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Admin Dashboard
                </a>
                <h3 class="fw-bold mt-2 mb-1 text-main"><i class="fa-solid fa-user-doctor text-info me-2"></i>Register Specialist Doctor</h3>
                <p class="text-muted small mb-0">Onboard a medical practitioner to the hospital roster</p>
            </div>

            <form method="POST" action="{{ url_for('routes.add_doctor') }}">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Doctor Full Name</label>
                    <input type="text" name="name" class="form-control bg-body border-secondary border-opacity-25 text-main" placeholder="e.g. Dr. Sarah Jenkins" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address (Login ID)</label>
                    <input type="email" name="email" class="form-control bg-body border-secondary border-opacity-25 text-main" placeholder="sarah@hms.org" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Department</label>
                    <select name="department_id" class="form-select bg-body border-secondary border-opacity-25 text-main" required>
                        <option value="" disabled selected>Select Department</option>
                        {% for dept in departments %}
                            <option value="{{ dept.id }}">{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Specialization Area</label>
                    <input type="text" name="specialization" class="form-control bg-body border-secondary border-opacity-25 text-main" placeholder="e.g. Interventional Cardiology">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Experience (Years)</label>
                        <input type="number" name="experience_years" value="8" min="0" max="60" class="form-control bg-body border-secondary border-opacity-25 text-main" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Consultation Fee (₹)</label>
                        <input type="number" step="10" name="consultation_fee" value="600.0" class="form-control bg-body border-secondary border-opacity-25 text-main" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Temporary Password</label>
                    <input type="password" name="password" class="form-control bg-body border-secondary border-opacity-25 text-main" placeholder="Create temporary password" required>
                </div>

                <button type="submit" class="btn btn-gradient-primary water-ripple w-100 py-3 fw-bold">
                    <i class="fa-solid fa-check-circle me-2"></i> Register Doctor
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
