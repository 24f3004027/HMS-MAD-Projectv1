<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Doctor</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.35);
      --glass-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 0% 0%, #38bdf8 0, transparent 55%),
        radial-gradient(circle at 100% 100%, #a855f7 0, transparent 55%),
        linear-gradient(135deg, #020617 0%, #0b1120 100%);
      color: #e5e7eb;
    }

    .navbar-glass {
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(148, 163, 253, 0.45);
    }

    .page-shell {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .glass-card {
      width: 100%;
      max-width: 520px;
      background: var(--glass-bg);
      border-radius: 1.4rem;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(26px);
      padding: 1.75rem 1.9rem;
    }

    .btn-glass {
      border-radius: 999px;
      padding: 0.45rem 1.3rem;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: linear-gradient(to right, rgba(59, 130, 246, 0.65), rgba(129, 140, 248, 0.85));
      color: #fff;
      font-weight: 600;
      box-shadow: 0 16px 40px rgba(37, 99, 235, 0.55);
    }

    .form-control, .form-select {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 253, 0.55);
      border-radius: 0.9rem;
      color: #e5e7eb;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-glass">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/admin/dashboard">HMS <span class="text-primary-emphasis">Admin</span></a>
  </div>
</nav>

<div class="page-shell">
  <div class="glass-card">
    <h2>Add New Doctor</h2>
    <p class="subtitle mb-3">Create a doctor account with login credentials and mapped department.</p>

    <form action="/admin/add_doctor" method="POST">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>

      <div class="mb-4">
        <label class="form-label">Select Department</label>
        <select name="department_id" class="form-select" required>
          <option value="">-- Select a Department --</option>
          {% for dept in departments %}
            <option value="{{ dept.id }}">{{ dept.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="d-flex justify-content-between">
        <a href="/admin/dashboard" class="link-light-soft">← Back</a>
        <button type="submit" class="btn-glass">Add Doctor</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
