<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Doctors</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.35);
      --glass-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 0% 0%, #38bdf8 0, transparent 55%),
        radial-gradient(circle at 100% 100%, #a855f7 0, transparent 55%),
        linear-gradient(135deg, #020617 0%, #020617 40%, #0b1120 100%);
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
    }

    .navbar-glass {
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(148, 163, 253, 0.45);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.7);
    }

    .page-shell {
      flex: 1;
      padding: 2.4rem 1rem 2.8rem;
    }

    .glass-main {
      border-radius: 1.6rem;
      background: radial-gradient(circle at top left, rgba(148, 163, 253, 0.28), transparent 60%),
                  radial-gradient(circle at bottom right, rgba(52, 211, 153, 0.25), transparent 55%),
                  rgba(15, 23, 42, 0.65);
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 253, 0.5);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      padding: 1.8rem 1.9rem;
    }

    @media (min-width: 992px) {
      .glass-main {
        padding: 2.4rem 2.5rem;
      }
    }

    .section-card {
      background: var(--glass-bg);
      border-radius: 1.3rem;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      padding: 1.3rem 1.4rem;
    }

    .section-card h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .muted-small {
      font-size: 0.82rem;
      color: #9ca3af;
    }

    table.table-glass {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      color: #e5e7eb;
    }

    table.table-glass th,
    table.table-glass td {
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid rgba(148, 163, 253, 0.25);
    }

    table.table-glass thead th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      border-bottom-color: rgba(148, 163, 253, 0.5);
    }

    a.link-light-soft {
      color: #c7d2fe;
      text-decoration: none;
      font-size: 0.88rem;
    }

    a.link-light-soft:hover {
      color: #e5e7eb;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-glass">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/admin/dashboard">
        HMS
        <span class="ms-1 text-primary-emphasis" style="font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;">
          Admin
        </span>
      </a>
    </div>
  </nav>

  <!-- Main glass panel -->
  <div class="page-shell">
    <div class="container">
      <div class="glass-main">
        <div class="section-card">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="mb-0">All Doctors</h2>
            <a href="/admin/add_doctor" class="link-light-soft">+ Add Doctor</a>
          </div>
          <p class="muted-small mb-2">
            View, edit, blacklist, or inspect credentials for all registered doctors.
          </p>

          <div class="table-responsive mt-2">
            <table class="table-glass">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Department ID</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {% for d in doctors %}
                <tr>
                  <td>{{ d.id }}</td>
                  <td>{{ d.name }}</td>
                  <td>{{ d.email }}</td>
                  <td>{{ d.department_id }}</td>
                  <td>
                    <a class="link-light-soft" href="/admin/update_doctor/{{ d.id }}">Edit</a> |
                    <a class="link-light-soft" href="/admin/blacklist_doctor/{{ d.id }}">Blacklist</a> |
                    <a class="link-light-soft" href="/admin/doctor_credentials/{{ d.id }}">Credentials</a>
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
