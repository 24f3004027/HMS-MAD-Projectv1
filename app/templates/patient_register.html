{% extends "base.html" %}

{% block title %}Patient Registration - ParkSmart Healthcare{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-5">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5 glass-card-hover">
            <div class="text-center mb-4">
                <div class="bg-success bg-opacity-20 d-inline-flex p-3 rounded-circle text-success mb-3 border border-success border-opacity-25 shadow-sm">
                    <i class="fa-solid fa-user-plus fs-1"></i>
                </div>
                <h3 class="fw-bold mb-1">Patient Registration</h3>
                <p class="text-muted small">Create your healthcare account to book specialist appointments</p>
            </div>

            <form method="POST" action="{{ url_for('routes.patient_register') }}">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Full Name</label>
                    <input type="text" name="name" class="form-control bg-body border-secondary border-opacity-25 text-main" placeholder="e.g. Ramrup Satpati" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control bg-body border-secondary border-opacity-25 text-main" placeholder="ramrup@example.com" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Age</label>
                        <input type="number" name="age" min="1" max="120" value="25" class="form-control bg-body border-secondary border-opacity-25 text-main" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Gender</label>
                        <select name="gender" class="form-select bg-body border-secondary border-opacity-25 text-main">
                            <option value="Male" selected>Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Contact Phone Number</label>
                    <input type="text" name="contact" class="form-control bg-body border-secondary border-opacity-25 text-main" placeholder="+91 9876543210">
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Create Password</label>
                    <input type="password" name="password" class="form-control bg-body border-secondary border-opacity-25 text-main" placeholder="Create a password" required>
                </div>

                <button type="submit" class="btn btn-gradient-primary water-ripple w-100 py-3 mb-3 fw-bold">
                    <i class="fa-solid fa-check-circle me-2"></i> Register Account
                </button>
            </form>

            <div class="text-center text-muted small mt-3">
                Already registered? <a href="{{ url_for('routes.login') }}" class="text-info text-decoration-none fw-semibold">Log in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
