<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Doctor</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.35);
      --glass-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 0% 0%, #38bdf8 0, transparent 55%),
        radial-gradient(circle at 100% 100%, #a855f7 0, transparent 55%),
        linear-gradient(135deg, #020617 0%, #020617 40%, #0b1120 100%);
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
    }

    .navbar-glass {
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(148, 163, 253, 0.45);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.7);
    }

    .page-shell {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    .glass-card {
      width: 100%;
      max-width: 520px;
      background: var(--glass-bg);
      border-radius: 1.5rem;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      padding: 1.9rem 2rem;
      color: #e5e7eb;
    }

    .glass-card h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .glass-card .subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 1.2rem;
    }

    label.form-label {
      font-size: 0.86rem;
      color: #e5e7eb;
    }

    .form-control {
      background: rgba(15, 23, 42, 0.78);
      border-radius: 0.9rem;
      border: 1px solid rgba(148, 163, 253, 0.55);
      color: #e5e7eb;
      font-size: 0.9rem;
    }

    .form-control:focus {
      background: rgba(15, 23, 42, 0.9);
      border-color: #a5b4fc;
      box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.65);
      color: #f9fafb;
    }

    .btn-glass {
      border-radius: 999px;
      padding: 0.45rem 1.4rem;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: linear-gradient(to right, rgba(59, 130, 246, 0.65), rgba(129, 140, 248, 0.85));
      color: #f9fafb;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      width: 100%;
      box-shadow: 0 16px 40px rgba(37, 99, 235, 0.55);
    }

    .btn-glass:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 18px 48px rgba(59, 130, 246, 0.75);
      transform: translateY(-1px);
    }

    a.link-light-soft {
      color: #c7d2fe;
      text-decoration: none;
      font-size: 0.86rem;
    }

    a.link-light-soft:hover {
      color: #e5e7eb;
      text-decoration: underline;
    }

    .muted-small {
      font-size: 0.82rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-glass">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/admin/dashboard">
        HMS
        <span class="ms-1 text-primary-emphasis" style="font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;">
          Admin
        </span>
      </a>
    </div>
  </nav>

  <!-- Centered edit form -->
  <div class="page-shell">
    <div class="glass-card">
      <h2>Edit Doctor</h2>
      <p class="subtitle">Update doctor details and associated department ID.</p>

      <form method="POST" class="mt-2">
        <div class="mb-3">
          <label class="form-label" for="name">Name</label>
          <input type="text" id="name" name="name" class="form-control" value="{{ doctor.name }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control" value="{{ doctor.email }}" required>
        </div>

        <div class="mb-4">
          <label class="form-label" for="department_id">Department ID</label>
          <input type="number" id="department_id" name="department_id" class="form-control" value="{{ doctor.department_id }}" required>
        </div>

        <button type="submit" class="btn btn-glass">Save Changes</button>

        <div class="d-flex justify-content-between align-items-center mt-3">
          <span class="muted-small">Ensure department ID matches an existing department.</span>
          <a href="/admin/dashboard" class="link-light-soft">Back to dashboard</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
