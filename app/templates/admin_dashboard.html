<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>Admin Dashboard</h2>

<p><b>Total Doctors:</b> {{ doctors }}</p>
<p><b>Total Patients:</b> {{ patients }}</p>
<p><b>Total Appointments:</b> {{ appointments }}</p>

<hr>

<h3>Hospital Statistics</h3>

<canvas id="statsChart" width="400" height="200"></canvas>

<script>
// Data from Flask
const totalDoctors = {{ doctors }};
const totalPatients = {{ patients }};
const totalAppointments = {{ appointments }};

// Chart.js
const ctx = document.getElementById('statsChart').getContext('2d');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Doctors', 'Patients', 'Appointments'],
        datasets: [{
            label: 'Hospital Stats',
            data: [totalDoctors, totalPatients, totalAppointments],
            backgroundColor: [
                'rgba(75, 192, 192, 0.6)',
                'rgba(255, 159, 64, 0.6)',
                'rgba(153, 102, 255, 0.6)'
            ],
            borderColor: [
                'rgba(75, 192, 192, 1)',
                'rgba(255, 159, 64, 1)',
                'rgba(153, 102, 255, 1)'
            ],
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: { display: true }
        },
        scales: {
            y: { beginAtZero: true }
        }
    }
});
</script>

<br><br>

<a href="/admin/add_doctor">Add Doctor</a> |
<a href="/admin/doctors">View Doctors</a> |
<a href="/admin/appointments">View Appointments</a> |
<a href="/logout">Logout</a>

</body>
</html>
