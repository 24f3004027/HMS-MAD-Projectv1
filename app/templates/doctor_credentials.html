<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctor Credentials</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<div class="container mt-4">
    <div class="card shadow-sm p-4">
        <h2 class="mb-3">Doctor Login Credentials</h2>

        <p><b>Name:</b> {{ doctor.name }}</p>
        <p><b>Email:</b> {{ doctor.email }}</p>

        <hr>

        <h4>Instructions for Admin</h4>
        <p>Provide this email and the password you entered in “Add Doctor”.</p>

        <p class="text-muted">
            <b>Note:</b> Only the hashed password is stored.  
            The original password cannot be retrieved.
        </p>

        <a href="/admin/doctors" class="btn btn-primary mt-3">Back</a>
    </div>
</div>

</body>
</html>
