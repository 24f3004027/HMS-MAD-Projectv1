<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Availability</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.35);
      --glass-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 0% 0%, #38bdf8 0, transparent 55%),
        radial-gradient(circle at 100% 100%, #a855f7 0, transparent 55%),
        linear-gradient(135deg, #020617 0%, #020617 40%, #0b1120 100%);
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
    }

    .navbar-glass {
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(148, 163, 253, 0.45);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.7);
    }

    .page-shell {
      flex: 1;
      padding: 2.4rem 1rem 2.8rem;
    }

    .glass-main {
      border-radius: 1.6rem;
      background: radial-gradient(circle at top left, rgba(148, 163, 253, 0.28), transparent 60%),
                  radial-gradient(circle at bottom right, rgba(52, 211, 153, 0.25), transparent 55%),
                  rgba(15, 23, 42, 0.65);
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 253, 0.5);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      padding: 1.8rem 1.9rem;
    }

    .section-card {
      background: var(--glass-bg);
      border-radius: 1.3rem;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      padding: 1.3rem 1.4rem;
    }

    table.table-glass {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      color: #e5e7eb;
    }

    table.table-glass th,
    table.table-glass td {
      padding: 0.6rem 0.7rem;
      border-bottom: 1px solid rgba(148, 163, 253, 0.25);
    }

    .btn-glass {
      border-radius: 999px;
      padding: 0.45rem 1.4rem;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: linear-gradient(to right, rgba(59, 130, 246, 0.65), rgba(129, 140, 248, 0.85));
      color: #f9fafb;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 16px 40px rgba(37, 99, 235, 0.55);
    }

    a.link-light-soft {
      color: #c7d2fe;
      text-decoration: none;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-glass">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/doctor/dashboard">
        HMS
        <span class="ms-1 text-primary-emphasis" style="font-size:0.8rem; letter-spacing:0.12em; text-transform:uppercase;">
          Doctor
        </span>
      </a>
    </div>
  </nav>

  <!-- Main Section -->
  <div class="page-shell">
    <div class="container">
      <div class="glass-main">

        <!-- Header -->
        <div class="d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center mb-4">
          <div>
            <h2 style="font-size:1.4rem;">Doctor Availability</h2>
            <p class="muted-small">Set which of the next 7 days you are available.</p>
          </div>
          <a href="/doctor/dashboard" class="link-light-soft">← Back to dashboard</a>
        </div>

        <!-- Availability Form -->
        <div class="section-card">
          <h3 class="mb-3">Set Availability for Next 7 Days</h3>

          <form method="POST">
            <div class="table-responsive">
              <table class="table-glass">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Available?</th>
                  </tr>
                </thead>
                <tbody>
                  {% for a in availability %}
                  <tr>
                    <td>{{ a.date }}</td>
                    <td>
                      <input type="checkbox" name="day_{{ a.id }}" {% if a.is_available %}checked{% endif %}>
                    </td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a href="/doctor/dashboard" class="link-light-soft">← Back</a>
              <button type="submit" class="btn-glass">Save Availability</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
