<!DOCTYPE html>
<html>
<head>
    <title>Doctor Availability</title>
</head>
<body>

<h2>Set Availability for Next 7 Days</h2>

<form method="POST">
    <table border="1" cellpadding="8">
        <tr>
            <th>Date</th>
            <th>Available?</th>
        </tr>

        {% for a in availability %}
        <tr>
            <td>{{ a.date }}</td>
            <td>
                <input type="checkbox" name="day_{{ a.id }}" {% if a.is_available %}checked{% endif %}>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <button type="submit">Save Availability</button>
</form>

<br>
<a href="/doctor/dashboard">Back</a>
</body>
</html>
