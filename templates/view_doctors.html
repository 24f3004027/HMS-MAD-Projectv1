<!DOCTYPE html>
<html>
<head>
    <title>All Doctors</title>
</head>
<body>

<h2>All Doctors</h2>

<table border="1" cellpadding="8">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Department ID</th>
        <th>Actions</th>
    </tr>

    {% for d in doctors %}
    <tr>
        <td>{{ d.id }}</td>
        <td>{{ d.name }}</td>
        <td>{{ d.email }}</td>
        <td>{{ d.department_id }}</td>
        <td>
            <a href="/admin/update_doctor/{{ d.id }}">Edit</a> |
            <a href="/admin/blacklist_doctor/{{ d.id }}">Blacklist</a>
        </td>

    </tr>
    {% endfor %}
</table>

</body>
</html>
